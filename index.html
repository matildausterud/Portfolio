<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>matildas.design | Portfolio</title>
    <meta name="description" content="Portfolio for Matilda Usterud, produkt designer och obotligt pysslare.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Nabla&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=logo-c9c94f-safari">
    <script>
      const appleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const safari = /Safari/.test(navigator.userAgent) && !/(Chrome|Chromium|CriOS|Edg|OPiOS|FxiOS|Android)/.test(navigator.userAgent);
      if (appleMobile || safari) document.documentElement.classList.add("use-bird-fallback");
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="matildas.design startsida">matildas.design</a>
      <nav class="site-nav" aria-label="Huvudnavigation">
        <a class="nav-design is-active" href="index.html">Design</a>
        <a class="nav-about" href="om-mig.html">Om mig</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p>Välkommen hit!</p>
          <h1 id="hero-title"><strong>Matilda Usterud</strong> <span>är en<br>produkt designer</span></h1>
        </div>

        <div class="hero-portrait hero-bird" aria-label="Animerad flygande wireframe-fågel">
          <img class="hero-bird-cloud" src="assets/cloud.png" alt="" aria-hidden="true">
          <img class="hero-bird-cloud hero-bird-cloud-tertiary" src="assets/cloud.png" alt="" aria-hidden="true">
          <video class="hero-bird-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
            <source src="assets/video/wireframe-bird-transparent.webm?v=10" type="video/webm">
          </video>
          <canvas class="hero-bird-safari-canvas" width="480" height="270" aria-hidden="true"></canvas>
        </div>
      </section>

      <section class="design" id="design" aria-label="Designcase">
        <div class="design-backdrop" aria-hidden="true"></div>
        <img class="design-cloud-secondary" src="assets/cloud.png" alt="" aria-hidden="true">

        <a class="project-card" href="lansforsakringar.html" aria-label="Öppna case: Länsförsäkringar">
          <div class="project-copy">
            <h2>Länsförsäkringar</h2>
            <p>Designade ett digitalt verktyg för rådgivare att använda tillsammans med kunden.</p>
          </div>
          <div class="project-media">
            <img src="assets/lf-laptop-3x.png" alt="Laptop med gränssnitt för Länsförsäkringar">
          </div>
        </a>

        <a class="project-card project-card-reverse" href="toyota-financial-services.html" aria-label="Öppna case: Toyota Financial Services">
          <div class="project-media">
            <img src="assets/toyota-laptop-3x.png" alt="Laptop med gränssnitt för Toyota Financial Services">
          </div>
          <div class="project-copy">
            <h2>Toyota Financial Services</h2>
            <p>Designade en plattform som samlar hela bilaffären i ett gemensamt verktyg.</p>
          </div>
        </a>
      </section>

    </main>

    <script>
      if (document.documentElement.classList.contains("use-bird-fallback")) {
        const video = document.querySelector(".hero-bird-video");
        const canvas = document.querySelector(".hero-bird-safari-canvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        let started = false;

        const resizeCanvas = () => {
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          const width = Math.round(canvas.clientWidth * pixelRatio);
          const height = Math.round(canvas.clientHeight * pixelRatio);

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }

          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = "high";
        };

        resizeCanvas();
        new ResizeObserver(resizeCanvas).observe(canvas);

        const renderBird = () => {
          if (video.readyState >= 2) {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = context.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;

            for (let index = 0; index < pixels.length; index += 4) {
              const brightness = Math.max(pixels[index], pixels[index + 1], pixels[index + 2]);
              const keyedAlpha = Math.max(0, Math.min(255, (brightness - 145) * 4));
              pixels[index + 3] = Math.min(pixels[index + 3], keyedAlpha);
            }

            context.putImageData(frame, 0, 0);
          }

          if ("requestVideoFrameCallback" in video) {
            video.requestVideoFrameCallback(renderBird);
          } else {
            requestAnimationFrame(renderBird);
          }
        };

        const startBird = () => {
          if (started) return;
          started = true;
          video.play().catch(() => {});
          renderBird();
        };

        if (video.readyState >= 2) {
          startBird();
        } else {
          video.addEventListener("loadeddata", startBird, { once: true });
        }
      }
    </script>

  </body>
</html>
